<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Kenyang Lual — Full-Stack Explorer</title>
  <desc id="desc">A colorful game-style banner with a cartoon of Kenyang wearing glasses, headphones, a headband, and an SNHU hoodie.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17213B" />
      <stop offset="1" stop-color="#242E57" />
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F3E8" />
      <stop offset="1" stop-color="#D9E3F0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#0B1024" flood-opacity="0.8" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6C9EFF" stroke-opacity="0.08" stroke-width="2" />
    </pattern>
  </defs>

  <!-- Background and game-board frame -->
  <rect width="1200" height="460" rx="28" fill="url(#sky)" />
  <rect width="1200" height="460" rx="28" fill="url(#grid)" />
  <rect x="12" y="12" width="1176" height="436" rx="20" fill="none" stroke="#FFCB6B" stroke-width="4" />
  <rect x="22" y="22" width="1156" height="416" rx="15" fill="none" stroke="#6C9EFF" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 9" />

  <!-- Pixel stars, coins, and distant scenery -->
  <g fill="#F7F3E8">
    <rect x="72" y="60" width="8" height="8" />
    <rect x="86" y="47" width="8" height="8" />
    <rect x="100" y="60" width="8" height="8" />
    <rect x="86" y="73" width="8" height="8" />
    <rect x="585" y="76" width="7" height="7" opacity="0.7" />
    <rect x="630" y="52" width="5" height="5" opacity="0.65" />
  </g>
  <g fill="#FFCB6B" stroke="#C98D34" stroke-width="4">
    <circle cx="675" cy="116" r="16" />
    <circle cx="1110" cy="92" r="16" />
  </g>
  <g fill="#FFF0A8">
    <rect x="670" y="104" width="6" height="24" rx="3" />
    <rect x="1105" y="80" width="6" height="24" rx="3" />
  </g>
  <path d="M0 375L95 300L170 348L280 257L380 345L486 294L615 374V460H0Z" fill="#202B4D" />
  <path d="M0 403L128 347L229 390L338 320L458 385L574 341L706 405V460H0Z" fill="#18213A" />
  <g fill="#6DE2BD" opacity="0.75">
    <rect x="44" y="390" width="52" height="12" />
    <rect x="96" y="378" width="52" height="24" />
    <rect x="432" y="391" width="72" height="11" />
    <rect x="504" y="379" width="34" height="23" />
  </g>

  <!-- Text panel -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(64 105)">
      <rect width="170" height="38" rx="6" fill="#FF6B6B" filter="url(#shadow)" />
      <text x="85" y="26" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="2">PLAYER 01</text>
    </g>

    <text x="64" y="205" fill="#F7F3E8" font-size="62" font-weight="900" letter-spacing="1">KENYANG LUAL</text>
    <text x="68" y="250" fill="#FFCB6B" font-size="25" font-weight="800" letter-spacing="5">FULL-STACK EXPLORER</text>
    <text x="68" y="292" fill="#AEBADB" font-size="18" font-weight="600">CS STUDENT @ SNHU  •  BUILDER  •  CREATIVE</text>

    <g transform="translate(67 326)">
      <text x="0" y="18" fill="#6DE2BD" font-size="15" font-weight="800">CURRENT MISSION</text>
      <rect x="0" y="31" width="510" height="30" rx="7" fill="#0D142A" stroke="#41517E" stroke-width="2" />
      <rect x="5" y="36" width="392" height="20" rx="4" fill="#6DE2BD" />
      <rect x="407" y="36" width="46" height="20" rx="4" fill="#FFCB6B" />
      <text x="0" y="88" fill="#F7F3E8" font-size="16">BUILD • LEARN • LIFT OTHERS</text>
    </g>
  </g>

  <!-- Cartoon avatar -->
  <g transform="translate(780 52)" filter="url(#shadow)">
    <!-- Character aura -->
    <circle cx="184" cy="192" r="176" fill="#6C9EFF" opacity="0.16" />
    <circle cx="184" cy="192" r="153" fill="#FFCB6B" opacity="0.09" stroke="#FFCB6B" stroke-width="3" stroke-dasharray="10 12" />

    <!-- Headphones behind head -->
    <path d="M90 143C90 70 138 42 184 42C237 42 280 79 280 144" fill="none" stroke="#111827" stroke-width="23" stroke-linecap="round" />
    <rect x="69" y="130" width="35" height="72" rx="16" fill="#27334F" stroke="#6C9EFF" stroke-width="5" />
    <rect x="264" y="130" width="35" height="72" rx="16" fill="#27334F" stroke="#6C9EFF" stroke-width="5" />

    <!-- Hoodie body -->
    <path d="M67 350C73 280 112 247 184 247C257 247 296 280 302 350Z" fill="url(#hoodie)" stroke="#AEBADB" stroke-width="5" />
    <path d="M131 264L184 314L237 264" fill="none" stroke="#AEBADB" stroke-width="5" />
    <path d="M149 332H219" stroke="#6C9EFF" stroke-width="5" />
    <text x="184" y="329" fill="#37517E" font-family="Arial, sans-serif" font-size="25" font-weight="900" text-anchor="middle">SNHU</text>

    <!-- Neck and head -->
    <path d="M155 226V267H213V226" fill="#7A4936" />
    <rect x="105" y="63" width="159" height="187" rx="75" fill="#8B533D" stroke="#2E1B1A" stroke-width="5" />
    <path d="M112 129C113 71 145 51 185 51C230 51 258 78 259 129C222 111 150 111 112 129Z" fill="#151829" />

    <!-- Hair and headband -->
    <g fill="#0D1020">
      <rect x="121" y="46" width="22" height="31" rx="7" />
      <rect x="145" y="38" width="23" height="39" rx="8" />
      <rect x="171" y="34" width="24" height="43" rx="8" />
      <rect x="198" y="39" width="22" height="38" rx="8" />
      <rect x="222" y="49" width="20" height="30" rx="7" />
    </g>
    <path d="M111 103C151 89 220 89 259 104V128C220 113 150 113 111 128Z" fill="#202A4C" />
    <path d="M115 106C153 95 218 95 255 107" fill="none" stroke="#6C9EFF" stroke-width="5" />

    <!-- Glasses -->
    <g fill="#BFE5FF" fill-opacity="0.24" stroke="#111827" stroke-width="7">
      <rect x="112" y="135" width="62" height="48" rx="16" />
      <rect x="194" y="135" width="62" height="48" rx="16" />
      <path d="M174 151C181 146 188 146 194 151" fill="none" />
    </g>
    <g fill="#111827">
      <circle cx="145" cy="159" r="6" />
      <circle cx="225" cy="159" r="6" />
    </g>
    <path d="M175 200C185 208 199 208 210 199" fill="none" stroke="#2E1B1A" stroke-width="5" stroke-linecap="round" />

    <!-- Laptop -->
    <path d="M96 304H273L253 385H116Z" fill="#263457" stroke="#0D142A" stroke-width="6" />
    <rect x="154" y="327" width="61" height="38" rx="7" fill="#6DE2BD" />
    <path d="M174 347L183 356L200 336" fill="none" stroke="#17213B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="79" y="383" width="212" height="13" rx="6" fill="#0D142A" />
  </g>

  <!-- Speech bubble -->
  <g transform="translate(978 38)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <path d="M0 18Q0 0 18 0H143Q161 0 161 18V60Q161 78 143 78H63L42 99L46 78H18Q0 78 0 60Z" fill="#F7F3E8" stroke="#0D142A" stroke-width="5" />
    <text x="80" y="49" fill="#17213B" font-size="22" font-weight="900" text-anchor="middle">READY!</text>
  </g>

  <!-- Tiny chef-cat sidekick -->
  <g transform="translate(1090 342)" stroke="#0D142A" stroke-width="4">
    <path d="M7 43L3 16L25 28L49 16L45 43Z" fill="#FFCB6B" />
    <rect x="7" y="36" width="39" height="41" rx="13" fill="#FFCB6B" />
    <path d="M10 34C13 12 40 12 43 34" fill="#F7F3E8" />
    <circle cx="19" cy="51" r="3" fill="#0D142A" stroke="none" />
    <circle cx="34" cy="51" r="3" fill="#0D142A" stroke="none" />
    <path d="M24 60L27 63L30 60" fill="none" />
  </g>
</svg>
