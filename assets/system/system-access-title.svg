<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
  <title id="title">System access</title>
  <desc id="desc">An animated neon heading introducing Kenyang's project portals.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0" /><stop offset="0.45" stop-color="#22D3EE" />
      <stop offset="0.6" stop-color="#8B5CF6" /><stop offset="1" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>
  <path d="M80 60H430M770 60H1120" stroke="#23314D" stroke-width="2" />
  <path d="M80 60H430M770 60H1120" stroke="url(#line)" stroke-width="2" stroke-dasharray="80 45" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="250;-250" dur="6s" repeatCount="indefinite" />
  </path>
  <g transform="translate(600 58)" fill="none" stroke="#22D3EE" filter="url(#glow)">
    <circle r="30" stroke-width="2" stroke-dasharray="8 7"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite" /></circle>
    <path d="M-9 0H9M0-9V9" stroke-width="3" />
  </g>
  <text x="600" y="22" text-anchor="middle" fill="#94A3B8" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="4">SELECT DESTINATION</text>
  <text x="600" y="112" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI',Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="7">SYSTEM ACCESS</text>
</svg>
