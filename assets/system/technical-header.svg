<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kenyang Lual technical identity header</title>
  <desc id="desc">An animated neon technical interface displaying Kenyang Lual's name, role, and online status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="0.5" stop-color="#071226" />
      <stop offset="1" stop-color="#10071F" />
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="0.5" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC" />
      <stop offset="0.52" stop-color="#D8E7FF" />
      <stop offset="1" stop-color="#FCE7F3" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#38BDF8" stroke-opacity="0.055" />
    </pattern>
    <filter id="glow" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="scan"><rect x="12" y="12" width="1176" height="296" rx="24" /></clipPath>
    <style>
      .micro{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#94A3B8;letter-spacing:4px}
      .name{font:900 72px 'Segoe UI',Arial,sans-serif;fill:url(#name);letter-spacing:7px}
      .role{font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#67E8F9;letter-spacing:4px}
      .status{font:800 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#D8E6FF;letter-spacing:2px}
    </style>
  </defs>

  <rect width="1200" height="320" rx="30" fill="url(#bg)" />
  <rect width="1200" height="320" rx="30" fill="url(#grid)" />
  <path d="M32 10H500L520 24H680L700 10H1168Q1190 10 1190 32V118M1190 202V288Q1190 310 1168 310H780L760 296H440L420 310H32Q10 310 10 288V202M10 118V32Q10 10 32 10Z" fill="none" stroke="url(#edge)" stroke-width="2.5" />

  <!-- corner calibration marks -->
  <g stroke="#22D3EE" stroke-width="2" opacity="0.75">
    <path d="M40 58H98M40 58V98M1160 58H1102M1160 58V98M40 262H98M40 262V222M1160 262H1102M1160 262V222" />
  </g>

  <!-- moving upper signal -->
  <path d="M112 62H1088" stroke="#1E293B" stroke-width="2" />
  <path d="M112 62H1088" stroke="url(#edge)" stroke-width="3" stroke-dasharray="140 310" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="900;-900" dur="9s" repeatCount="indefinite" />
  </path>

  <text x="600" y="48" text-anchor="middle" class="micro">IDENTITY NODE // KL-01</text>
  <text x="600" y="160" text-anchor="middle" class="name">KENYANG LUAL</text>
  <text x="600" y="204" text-anchor="middle" class="role">SOFTWARE ENGINEER • FULL-STACK + MOBILE</text>

  <!-- status chips -->
  <g transform="translate(600 254)">
    <g transform="translate(-244 0)">
      <rect x="-102" y="-20" width="204" height="40" rx="20" fill="#040B1B" stroke="#1F5368" />
      <circle cx="-76" r="6" fill="#22D3EE" filter="url(#glow)"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite" /></circle>
      <text x="13" y="4" text-anchor="middle" class="status">SYSTEM ONLINE</text>
    </g>
    <g>
      <rect x="-102" y="-20" width="204" height="40" rx="20" fill="#040B1B" stroke="#4B3A79" />
      <text x="0" y="4" text-anchor="middle" class="status">SNHU // 2027</text>
    </g>
    <g transform="translate(244 0)">
      <rect x="-102" y="-20" width="204" height="40" rx="20" fill="#040B1B" stroke="#723653" />
      <text x="0" y="4" text-anchor="middle" class="status">BUILDING THE FUTURE</text>
    </g>
  </g>

  <!-- animated scan line -->
  <g clip-path="url(#scan)" opacity="0.12">
    <rect x="12" y="-24" width="1176" height="28" fill="#22D3EE">
      <animate attributeName="y" values="-24;344" dur="7s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
