<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Kenyang developer console</title>
  <desc id="desc">An animated neon command center showing Kenyang's current developer status and active Guardian build.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="0.55" stop-color="#071226" />
      <stop offset="1" stop-color="#100A24" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="0.5" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#EC4899" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F8FAFC" />
      <stop offset="0.25" stop-color="#67E8F9" />
      <stop offset="0.58" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#38BDF8" stroke-opacity="0.055" />
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="scanClip"><rect x="20" y="20" width="1160" height="320" rx="24" /></clipPath>
    <style>
      .label{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#22D3EE}
      .heading{font:800 26px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#F8FAFC}
      .copy{font:500 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#A5B4CF}
      .code{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#D8E6FF}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)" />
  <rect width="1200" height="360" rx="28" fill="url(#grid)" />
  <rect x="10" y="10" width="1180" height="340" rx="22" fill="none" stroke="url(#stroke)" stroke-width="2" />
  <path d="M30 50H420M780 50H1170" stroke="url(#stroke)" stroke-width="2" opacity="0.7" />
  <text x="600" y="56" text-anchor="middle" class="label">DEVELOPER CONSOLE // KENYANG.01</text>

  <!-- left terminal -->
  <g transform="translate(58 94)">
    <rect width="330" height="204" rx="16" fill="#030817" stroke="#20304C" stroke-width="2" />
    <circle cx="22" cy="22" r="5" fill="#EC4899" />
    <circle cx="40" cy="22" r="5" fill="#FACC15" />
    <circle cx="58" cy="22" r="5" fill="#22D3EE" />
    <text x="20" y="64" class="code" fill="#22D3EE">$ whoami</text>
    <text x="20" y="91" class="copy">full-stack + mobile developer</text>
    <text x="20" y="124" class="code" fill="#8B5CF6">$ current_mission</text>
    <text x="20" y="151" class="copy">build useful, human systems</text>
    <text x="20" y="184" class="code">$ status <tspan fill="#67E8F9">ONLINE_</tspan></text>
    <rect x="119" y="172" width="9" height="16" fill="#67E8F9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- center reactor -->
  <g transform="translate(600 192)">
    <circle r="118" fill="url(#core)" opacity="0.24">
      <animate attributeName="r" values="106;122;106" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.18;0.34;0.18" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle r="82" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="12 18" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle r="59" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-dasharray="42 16">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle r="31" fill="#071226" stroke="#67E8F9" stroke-width="5" filter="url(#glow)" />
    <path d="M-13 1L-3 11L16-12" fill="none" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <g stroke="#22D3EE" stroke-width="2" opacity="0.75">
      <path d="M0-83V-118M0 83V118M-83 0H-118M83 0H118" />
    </g>
  </g>

  <!-- right status card -->
  <g transform="translate(812 94)">
    <rect width="330" height="204" rx="16" fill="#030817" stroke="#20304C" stroke-width="2" />
    <text x="24" y="38" class="label">ACTIVE BUILD</text>
    <text x="24" y="76" class="heading">GUARDIAN</text>
    <text x="24" y="103" class="copy">personal finance • mobile • web</text>
    <rect x="24" y="127" width="282" height="18" rx="9" fill="#111B32" />
    <rect x="27" y="130" width="213" height="12" rx="6" fill="url(#stroke)">
      <animate attributeName="width" values="172;258;213;172" dur="7s" repeatCount="indefinite" />
    </rect>
    <text x="24" y="177" class="copy">SIGNAL</text>
    <circle cx="96" cy="172" r="6" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="111" y="177" class="code" fill="#67E8F9">STABLE</text>
  </g>

  <g clip-path="url(#scanClip)" opacity="0.14">
    <rect x="20" y="-40" width="1160" height="34" fill="#22D3EE">
      <animate attributeName="y" values="-40;390" dur="7s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
