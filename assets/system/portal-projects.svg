<svg xmlns="http://www.w3.org/2000/svg" width="500" height="620" viewBox="0 0 500 620" role="img" aria-labelledby="title desc">
  <title id="title">Project archive portal</title>
  <desc id="desc">An animated connected repository portal linking to all of Kenyang's GitHub projects.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%"><stop stop-color="#301126" /><stop offset="1" stop-color="#020617" /></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EC4899" /><stop offset="1" stop-color="#22D3EE" /></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#EC4899" stroke-opacity="0.05" /></pattern>
    <style>.title{font:900 34px 'Segoe UI',Arial,sans-serif;fill:#F8FAFC;letter-spacing:3px}.sub{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#94A3B8}.tag{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#FCE7F3;letter-spacing:2px}.cta{font:800 14px ui-monospace,Menlo,Consolas,monospace;fill:#F9A8D4;letter-spacing:3px}</style>
  </defs>
  <rect width="500" height="620" rx="28" fill="url(#bg)" />
  <rect width="500" height="620" rx="28" fill="url(#grid)" />
  <rect x="7" y="7" width="486" height="606" rx="23" fill="none" stroke="url(#edge)" stroke-width="2" />
  <text x="250" y="54" text-anchor="middle" class="tag">REPOSITORY SYSTEM // 03</text>
  <g transform="translate(250 226)">
    <circle r="135" fill="#EC4899" opacity="0.065"><animate attributeName="r" values="122;142;122" dur="5.5s" repeatCount="indefinite" /></circle>
    <circle r="105" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="18 16" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="16s" repeatCount="indefinite" /></circle>
    <g fill="#071226" stroke="url(#edge)" stroke-width="5" filter="url(#glow)">
      <rect x="-34" y="-34" width="68" height="68" rx="15" />
      <rect x="-102" y="-100" width="54" height="54" rx="13" />
      <rect x="48" y="-100" width="54" height="54" rx="13" />
      <rect x="-102" y="47" width="54" height="54" rx="13" />
      <rect x="48" y="47" width="54" height="54" rx="13" />
    </g>
    <g stroke="#F9A8D4" stroke-width="4"><path d="M-34-25L-48-46M34-25L48-46M-34 25L-48 47M34 25L48 47" /></g>
    <circle r="11" fill="#22D3EE"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" /></circle>
  </g>
  <text x="250" y="415" text-anchor="middle" class="title">PROJECTS</text>
  <text x="250" y="450" text-anchor="middle" class="sub">apps • experiments • coursework</text>
  <g transform="translate(250 500)">
    <rect x="-145" y="-22" width="290" height="44" rx="22" fill="#071226" stroke="#85345F" />
    <text x="0" y="5" text-anchor="middle" class="tag">40+ PUBLIC REPOSITORIES</text>
  </g>
  <text x="250" y="572" text-anchor="middle" class="cta">BROWSE ARCHIVE →</text>
</svg>
