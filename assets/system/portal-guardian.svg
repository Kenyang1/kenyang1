<svg xmlns="http://www.w3.org/2000/svg" width="500" height="620" viewBox="0 0 500 620" role="img" aria-labelledby="title desc">
  <title id="title">Guardian finance portal</title>
  <desc id="desc">An animated shield portal linking to Kenyang's Guardian personal-finance project.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%"><stop stop-color="#0B2440" /><stop offset="1" stop-color="#020617" /></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE" /><stop offset="1" stop-color="#8B5CF6" /></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#22D3EE" stroke-opacity="0.05" /></pattern>
    <style>.title{font:900 34px 'Segoe UI',Arial,sans-serif;fill:#F8FAFC;letter-spacing:3px}.sub{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#94A3B8}.tag{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#CFFAFE;letter-spacing:2px}.cta{font:800 14px ui-monospace,Menlo,Consolas,monospace;fill:#22D3EE;letter-spacing:3px}</style>
  </defs>
  <rect width="500" height="620" rx="28" fill="url(#bg)" />
  <rect width="500" height="620" rx="28" fill="url(#grid)" />
  <rect x="7" y="7" width="486" height="606" rx="23" fill="none" stroke="url(#edge)" stroke-width="2" />
  <text x="250" y="54" text-anchor="middle" class="tag">FINANCE SYSTEM // 01</text>
  <g transform="translate(250 226)">
    <circle r="135" fill="#22D3EE" opacity="0.06"><animate attributeName="r" values="122;142;122" dur="5s" repeatCount="indefinite" /></circle>
    <circle r="105" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="12 16" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="15s" repeatCount="indefinite" /></circle>
    <circle r="78" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="36 18"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="10s" repeatCount="indefinite" /></circle>
    <path d="M0-68L58-42V5C58 49 30 78 0 94C-30 78-58 49-58 5V-42Z" fill="#071226" stroke="url(#edge)" stroke-width="7" filter="url(#glow)" />
    <path d="M-27 7L-7 27L31-21" fill="none" stroke="#67E8F9" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="250" y="415" text-anchor="middle" class="title">GUARDIAN</text>
  <text x="250" y="450" text-anchor="middle" class="sub">clear • protected • approachable</text>
  <g transform="translate(250 500)">
    <rect x="-166" y="-22" width="332" height="44" rx="22" fill="#071226" stroke="#1E7490" />
    <text x="0" y="5" text-anchor="middle" class="tag">EXPO  •  TYPESCRIPT  •  API</text>
  </g>
  <text x="250" y="572" text-anchor="middle" class="cta">OPEN PROJECT →</text>
</svg>
