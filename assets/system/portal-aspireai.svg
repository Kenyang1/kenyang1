<svg xmlns="http://www.w3.org/2000/svg" width="500" height="620" viewBox="0 0 500 620" role="img" aria-labelledby="title desc">
  <title id="title">AspireAI career guidance portal</title>
  <desc id="desc">An animated orbital compass linking to Kenyang's AspireAI career-guidance platform.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%"><stop stop-color="#24103B" /><stop offset="1" stop-color="#020617" /></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B5CF6" /><stop offset="0.5" stop-color="#EC4899" /><stop offset="1" stop-color="#22D3EE" /></linearGradient>
    <radialGradient id="core"><stop stop-color="#F8FAFC" /><stop offset="0.3" stop-color="#C4B5FD" /><stop offset="0.7" stop-color="#8B5CF6" /><stop offset="1" stop-color="#020617" /></radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#A78BFA" stroke-opacity="0.055" /></pattern>
    <style>.title{font:900 34px 'Segoe UI',Arial,sans-serif;fill:#F8FAFC;letter-spacing:3px}.sub{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#94A3B8}.tag{font:700 12px ui-monospace,Menlo,Consolas,monospace;fill:#EDE9FE;letter-spacing:2px}.cta{font:800 14px ui-monospace,Menlo,Consolas,monospace;fill:#C4B5FD;letter-spacing:3px}</style>
  </defs>
  <rect width="500" height="620" rx="28" fill="url(#bg)" />
  <rect width="500" height="620" rx="28" fill="url(#grid)" />
  <rect x="7" y="7" width="486" height="606" rx="23" fill="none" stroke="url(#edge)" stroke-width="2" />
  <text x="250" y="54" text-anchor="middle" class="tag">AI CAREER SYSTEM // 02</text>

  <g transform="translate(250 226)">
    <circle r="137" fill="#8B5CF6" opacity="0.08"><animate attributeName="r" values="122;142;122" dur="5s" repeatCount="indefinite" /></circle>
    <circle r="108" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="9 16" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="15s" repeatCount="indefinite" /></circle>
    <circle r="79" fill="none" stroke="#EC4899" stroke-width="3" stroke-dasharray="31 18"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="10s" repeatCount="indefinite" /></circle>
    <circle r="49" fill="url(#core)" filter="url(#glow)" />
    <!-- compass / future path -->
    <path d="M0-34L12-12L34 0L12 12L0 34L-12 12L-34 0L-12-12Z" fill="#F8FAFC" stroke="#071226" stroke-width="4" />
    <circle r="9" fill="#22D3EE" />
    <g fill="#071226" stroke="#C4B5FD" stroke-width="3">
      <circle cx="0" cy="-108" r="13" /><circle cx="94" cy="54" r="13" /><circle cx="-94" cy="54" r="13" />
    </g>
    <g stroke="#A78BFA" stroke-width="2"><path d="M0-79V-95M69 39L82 47M-69 39L-82 47" /></g>
  </g>

  <text x="250" y="415" text-anchor="middle" class="title">ASPIREAI</text>
  <text x="250" y="450" text-anchor="middle" class="sub">your future, made clearer</text>
  <g transform="translate(250 500)">
    <rect x="-166" y="-22" width="332" height="44" rx="22" fill="#071226" stroke="#6D3CB3" />
    <text x="0" y="5" text-anchor="middle" class="tag">NEXT.JS  •  TYPESCRIPT  •  OPENAI</text>
  </g>
  <text x="250" y="572" text-anchor="middle" class="cta">EXPLORE PLATFORM →</text>
</svg>
