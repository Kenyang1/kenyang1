<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="38" viewBox="0 0 1200 38" role="img" aria-labelledby="title desc">
  <title id="title">Animated neon system divider</title>
  <desc id="desc">Cyan, violet, and pink energy move through a thin circuit line.</desc>
  <defs>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="0.24" stop-color="#22D3EE" />
      <stop offset="0.5" stop-color="#8B5CF6" />
      <stop offset="0.76" stop-color="#EC4899" />
      <stop offset="1" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-400%" width="160%" height="900%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <path d="M30 19H548L563 7H637L652 19H1170" fill="none" stroke="#1E293B" stroke-width="5" />
  <path d="M30 19H548L563 7H637L652 19H1170" fill="none" stroke="url(#energy)" stroke-width="2" stroke-dasharray="170 80" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="500;0;-500" dur="8s" repeatCount="indefinite" />
  </path>
  <g transform="translate(600 13)" filter="url(#glow)">
    <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="#020617" stroke="#22D3EE" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="8s" repeatCount="indefinite" />
    </rect>
    <circle r="3" fill="#F8FAFC"><animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite" /></circle>
  </g>
</svg>
