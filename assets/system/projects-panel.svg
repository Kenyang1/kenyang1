<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650" role="img" aria-labelledby="title desc">
  <title id="title">Projects portal</title><desc id="desc">An animated neon repository core inviting visitors to browse Kenyang's projects.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop stop-color="#0B1F3A" /><stop offset="1" stop-color="#020617" /></radialGradient>
    <radialGradient id="core"><stop stop-color="#F8FAFC" /><stop offset="0.32" stop-color="#67E8F9" /><stop offset="0.7" stop-color="#8B5CF6" /><stop offset="1" stop-color="#020617" /></radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <style>.title{font:900 37px 'Segoe UI',Arial,sans-serif;fill:#F8FAFC;letter-spacing:3px}.sub{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#94A3B8}.cta{font:800 14px ui-monospace,Menlo,Consolas,monospace;fill:#22D3EE;letter-spacing:3px}</style>
  </defs>
  <rect width="500" height="650" rx="26" fill="url(#bg)" />
  <rect x="7" y="7" width="486" height="636" rx="21" fill="none" stroke="#1F4E67" stroke-width="2" />
  <g transform="translate(250 260)">
    <circle r="130" fill="#22D3EE" opacity="0.08"><animate attributeName="r" values="115;135;115" dur="4s" repeatCount="indefinite" /></circle>
    <circle r="98" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="10 15"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="13s" repeatCount="indefinite" /></circle>
    <circle r="70" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="36 16"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="9s" repeatCount="indefinite" /></circle>
    <circle r="45" fill="url(#core)" filter="url(#glow)" />
    <path d="M-20 0H20M0-20V20" stroke="#020617" stroke-width="8" stroke-linecap="round" />
  </g>
  <text x="250" y="458" text-anchor="middle" class="title">PROJECTS</text>
  <text x="250" y="494" text-anchor="middle" class="sub">products • games • experiments</text>
  <text x="250" y="558" text-anchor="middle" class="cta">ENTER ARCHIVE →</text>
  <path d="M85 584H415" stroke="#1E293B" stroke-width="2" /><circle cx="250" cy="584" r="5" fill="#22D3EE"><animate attributeName="cx" values="100;400;100" dur="6s" repeatCount="indefinite" /></circle>
</svg>
