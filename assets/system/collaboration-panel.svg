<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650" role="img" aria-labelledby="title desc">
  <title id="title">Collaboration signal</title><desc id="desc">An animated handshake-style connection signal inviting visitors to collaborate with Kenyang.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop stop-color="#301128" /><stop offset="1" stop-color="#020617" /></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE" /><stop offset="0.5" stop-color="#8B5CF6" /><stop offset="1" stop-color="#EC4899" /></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <style>.title{font:900 34px 'Segoe UI',Arial,sans-serif;fill:#F8FAFC;letter-spacing:2px}.sub{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#94A3B8}.cta{font:800 14px ui-monospace,Menlo,Consolas,monospace;fill:#F9A8D4;letter-spacing:3px}</style>
  </defs>
  <rect width="500" height="650" rx="26" fill="url(#bg)" />
  <rect x="7" y="7" width="486" height="636" rx="21" fill="none" stroke="#6B2C50" stroke-width="2" />
  <g transform="translate(250 255)">
    <circle r="132" fill="#EC4899" opacity="0.065"><animate attributeName="r" values="120;140;120" dur="4.5s" repeatCount="indefinite" /></circle>
    <circle r="103" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="14 16"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="14s" repeatCount="indefinite" /></circle>
    <g fill="none" stroke="url(#edge)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M-89-4L-48-45Q-30-63-11-44L12-22" />
      <path d="M89-4L48-45Q30-63 11-44L-12-22" />
      <path d="M-61 25L-20 65Q0 84 20 65L61 25" />
      <path d="M-24-16L25 32" />
    </g>
    <circle cx="-96" cy="0" r="9" fill="#22D3EE" /><circle cx="96" cy="0" r="9" fill="#EC4899" />
  </g>
  <text x="250" y="452" text-anchor="middle" class="title">COLLABORATE</text>
  <text x="250" y="489" text-anchor="middle" class="sub">ideas • code • community</text>
  <text x="250" y="555" text-anchor="middle" class="cta">SEND SIGNAL →</text>
  <path d="M85 584H415" stroke="#1E293B" stroke-width="2" /><circle cx="250" cy="584" r="5" fill="#EC4899"><animate attributeName="cx" values="100;400;100" dur="5s" repeatCount="indefinite" /></circle>
</svg>
