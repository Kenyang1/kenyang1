<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650" role="img" aria-labelledby="title desc">
  <title id="title">Focus domains portal</title><desc id="desc">An animated orbital panel showing Kenyang's focus on mobile, web, APIs, and AI.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop stop-color="#22123B" /><stop offset="1" stop-color="#020617" /></radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
    <style>.title{font:900 37px 'Segoe UI',Arial,sans-serif;fill:#F8FAFC;letter-spacing:3px}.sub{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#94A3B8}.cta{font:800 14px ui-monospace,Menlo,Consolas,monospace;fill:#C4B5FD;letter-spacing:3px}.node{font:800 12px ui-monospace,Menlo,Consolas,monospace;fill:#F8FAFC}</style>
  </defs>
  <rect width="500" height="650" rx="26" fill="url(#bg)" />
  <rect x="7" y="7" width="486" height="636" rx="21" fill="none" stroke="#52358A" stroke-width="2" />
  <g transform="translate(250 260)">
    <circle r="120" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="12 13"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="17s" repeatCount="indefinite" /></circle>
    <circle r="76" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="23 16"><animateTransform attributeName="transform" type="rotate" values="360;0" dur="11s" repeatCount="indefinite" /></circle>
    <circle r="42" fill="#0B1026" stroke="#C4B5FD" stroke-width="4" filter="url(#glow)" />
    <text x="0" y="5" text-anchor="middle" class="node">BUILD</text>
    <g fill="#071226" stroke="#8B5CF6" stroke-width="3">
      <circle cx="0" cy="-120" r="26" /><circle cx="120" cy="0" r="26" /><circle cx="0" cy="120" r="26" /><circle cx="-120" cy="0" r="26" />
    </g>
    <g class="node"><text x="0" y="-115" text-anchor="middle">WEB</text><text x="120" y="5" text-anchor="middle">API</text><text x="0" y="125" text-anchor="middle">AI</text><text x="-120" y="5" text-anchor="middle">APP</text></g>
  </g>
  <text x="250" y="458" text-anchor="middle" class="title">DOMAINS</text>
  <text x="250" y="494" text-anchor="middle" class="sub">mobile • web • APIs • AI</text>
  <text x="250" y="558" text-anchor="middle" class="cta">VIEW PORTFOLIO →</text>
  <path d="M85 584H415" stroke="#1E293B" stroke-width="2" /><circle cx="250" cy="584" r="5" fill="#8B5CF6"><animate attributeName="cx" values="400;100;400" dur="6s" repeatCount="indefinite" /></circle>
</svg>
